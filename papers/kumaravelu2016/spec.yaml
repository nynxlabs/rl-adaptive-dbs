  title: "A biophysical model of the cortex-basal ganglia-thalamus network in the 6-OHDA lesioned rat model of Parkinson's disease"
  authors: [Karthik Kumaravelu, David T. Brocker, Warren M. Grill]
  year: 2016
  doi: "10.1007/s10827-016-0593-9"
  version: accepted manuscript   # PMC author manuscript, PMC4975943

rights:
