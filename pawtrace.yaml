# pawtrace project config — the record of which checks were on.
pawtrace: 1
name: rl-adaptive-dbs
profile: standard   # minimal | standard | strict
modules:      # per-module overrides on top of the profile
  author-questions: true   # questions for Devin and, later, the authors
  panel-claims: true       # parallel agents claim a panel before working on it
  preregistration: true    # freeze gates + config + seeds before final runs
  foundations: false       # not built in pawtrace yet
  scaffolding: false
  dependency-graph: false
  paper-tables: false
paths:
  papers: papers
  runs: runs          # gitignore this
  status: STATUS.md   # generated by `pawtrace status --write`
  images: figures
  questions: QUESTIONS.md   # author-questions module: generated by `pawtrace questions --write`
  # claims: …        # panel-claims module: default inside .git (shared by every worktree)
  vars: {}          # ${name} substitutions for paths
extract:              # the extract module (`pawtrace modules enable extract`; on in standard/strict)
  backend: pdfium     # pdfium (built in: uv sync --extra extract) | command (any PDF -> markdown tool)
  dpi: 200
  command: []         # backend command: argv with {pdf} and {out}, e.g. [marker_single, '{pdf}', --output_dir, '{out}']
  formula_command: [] # optional: argv with {image}; prints LaTeX for one equation crop
  timeout_s: 1800
