# Every piece of rl-adaptive-dbs and where its rights come from: the source of truth for
# LICENSES.md (`uv run python tools/licenses.py --write` renders it; tests check it's current).
#
# mode:
#   own        our code, Apache-2.0, Copyright (c) 2026 nynxlabs LLC
#   vendored   copied into this repo; its license text + notice are kept next to it (`license_file`)
#   linked     not in this repo: an installed dependency or an opt-in extra fetched from upstream
#   extra      our own opt-in package under extras/<id>/ with its own license (e.g. GPL-3.0 glue
#              around linked GPL code); the core never imports it
#   reference  read for facts only (equations, values, conventions); no code or text is copied
#   excluded   kept out entirely, linked or not (no license, or our own rules), until `until`
#
# For a paper, `spec:` names its pawtrace spec, kept in the private `.pawtrace/` folder
# (`.pawtrace/papers/<spec>/spec.yaml`, gitignored here). `rights:` repeats the two facts the
# table shows (license, AI tools) so readers without that folder see them; where the folder is
# present, `tools/licenses.py` checks they still match the spec's `rights:` block.
components:
  - id: core
    name: rl-adaptive-dbs (plants, controllers, adapters, baselines, recipes, tests)
    kind: code
    mode: own
    license: Apache-2.0
    credit: nynxlabs LLC
    path: .

  - id: plant.kumaravelu2016
    name: Kumaravelu 2016 cortex-basal ganglia-thalamus plant (clean-room rebuild)
    kind: plant
    mode: own
    license: Apache-2.0
    credit: "Model: Kumaravelu, Brocker & Grill (2016), J Comput Neurosci. Our implementation, written from the paper."
    path: plants/parkinsons/kumaravelu2016/
    spec: kumaravelu2016
    rights: {license: publisher-copyright, ai_tools: allowed}
    note: Not on main yet.

  - id: code.modeldb206232
    name: Kumaravelu et al. ModelDB code (model 206232) and its GitHub mirror
    kind: code
    mode: excluded
    license: none
    source: https://modeldb.science/206232
    credit: Kumaravelu, Brocker & Grill
    until: the rights holders grant use in writing

  - id: paper.so2012
    name: So, Kent & Grill 2012 (cited by the plant for synapse conventions)
    kind: paper
    mode: reference
    spec: so2012
    credit: So, Kent & Grill (2012)
    note: Spec lands with the plant.

  - id: controller.ravivarapu
    name: SEA-DBS controller (Ravivarapu et al.)
    kind: controller
    mode: own
    license: Apache-2.0
    path: controllers/parkinsons/rl/sea_dbs/
    spec: ravivarapu
    rights: {license: CC-BY-4.0, ai_tools: allowed}
    credit: "Method: Ravivarapu et al., arXiv 2507.06326 (CC BY 4.0). Our implementation."

  - id: controller.mehregan
    name: Mehregan et al. 2024 controller
    kind: controller
    mode: own
    license: Apache-2.0
    path: controllers/parkinsons/rl/ddpg/
    spec: mehregan
    rights: {license: publisher-copyright, ai_tools: never}
    credit: "Method: Mehregan et al. (2024), IEEE MobileCloud. Our implementation."

  - id: controller.nguyen
    name: Nguyen et al. 2025 controller
    kind: controller
    mode: own
    license: Apache-2.0
    path: controllers/parkinsons/rl/snn/
    spec: nguyen
    rights: {license: publisher-copyright, ai_tools: never}
    credit: "Method: Nguyen et al. (2025), IEEE ISCAS. Our implementation."

  - id: code.cl-dbs-rl
    name: CL-DBS-RL (Nguyen group follow-up code)
    kind: code
    mode: reference
    license: MIT
    source: https://github.com/howyoubinh/CL-DBS-RL
    credit: Binh Nguyen
    note: Gap-fill values only, no code copied. If code is ever vendored, keep its MIT license + notice with it. Its plant files port the Kumaravelu model and keep that model's status.

  - id: code.fleming2020
    name: Fleming, Dunn & Lowery 2020 model code
    kind: code
    mode: linked
    license: GPL-3.0
    credit: Fleming, Dunn & Lowery
    source: the authors' official GPL-3.0 repository; URL and pinned commit set in extras/fleming2020 when it lands
    note: Fetched from the authors' official repository at install time, pinned to a commit, for the opt-in extras/fleming2020 module only; never copied into this repo.

  - id: dep.pawtrace
    name: pawtrace
    kind: tool
    mode: linked
    license: Apache-2.0
    source: https://github.com/nynxlabs/pawtrace
    credit: nynxlabs LLC

  - id: dep.numpy
    name: NumPy
    kind: library
    mode: linked
    license: BSD-3-Clause
    source: https://numpy.org
    credit: NumPy developers
