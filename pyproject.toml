[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rl-adaptive-dbs"
version = "0.1.0"
description = "Exploration of reinforcement learning for adaptive deep brain stimulation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.3.0",
    "numba>=0.61.2",
    "numpy>=2.4.5",
    "pyyaml>=6.0.2",
    "scipy>=1.17.1",
    "torch>=2.2.0",
]

[project.scripts]
rl-dbs = "rl_adaptive_dbs.cli:main"
rl-dbs-tui = "rl_adaptive_dbs.tui:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "textual>=1.0.0",
]
matlab = [
    "matlabengine==25.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running checks (large rollouts, training smoke)",
    "matlab: requires MATLAB and the Kumaravelu reference bridge",
]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/envs", "src/controllers", "src/benchmarks", "src/rl_adaptive_dbs"]
