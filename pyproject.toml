[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rl-adaptive-dbs"
version = "0.1.0"
description = "Exploration of reinforcement learning for adaptive deep brain stimulation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=2.4.5",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["envs", "controllers"]
